name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      # Userscript managers only update when the version goes up, so every build gets its own
      - name: Set version
        run: echo "BF_VERSION=$(node -p "require('./package.json').version").${{ github.run_number }}" >> "$GITHUB_ENV"

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: better-fenrid
          path: dist/

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BF_VERSION }}
          name: Better Fenrid ${{ env.BF_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          generate_release_notes: true
          files: |
            dist/betterfenrid.user.js
            dist/betterfenrid.js