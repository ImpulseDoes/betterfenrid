name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      # Userscript managers only update when the version goes up, so every build gets its own
      - name: Set version
        id: version
        run: |
          version="$(node -p "require('./package.json').version").${{ github.run_number }}"
          echo "BF_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: better-fenrid
          path: dist/

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BF_VERSION }}
          name: Better Fenrid ${{ env.BF_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          generate_release_notes: true
          files: |
            dist/betterfenrid.user.js
            dist/betterfenrid.js

  desktop:
    needs: build
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '--exe')
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      BF_VERSION: ${{ needs.build.outputs.version }}
      # electron-builder fetches its own copy, the one from npm isn't needed
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Install app dependencies
        working-directory: electron
        run: npm ci

      - name: Build the media helper
        working-directory: electron
        run: npm run helper

      - name: Build the portable exe
        working-directory: electron
        run: node scripts/dist.cjs portable

      - uses: actions/upload-artifact@v4
        with:
          name: better-fenrid-desktop
          path: electron/out/Better-Fenrid-Portable.exe

      - name: Attach to this build's release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BF_VERSION }}
          files: electron/out/Better-Fenrid-Portable.exe

      - name: Update the desktop release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop
          name: Better Fenrid Desktop
          target_commitish: ${{ github.sha }}
          make_latest: 'false'
          body: |
            The newest Better Fenrid desktop app for Windows, built from ${{ github.sha }} with mod v${{ env.BF_VERSION }} inside.
            The mod updates itself, so this only needs downloading again when the app itself changes.
          files: electron/out/Better-Fenrid-Portable.exe

  android:
    needs: build
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '--apk')
    runs-on: ubuntu-latest
    env:
      BF_VERSION: ${{ needs.build.outputs.version }}
      BF_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: better-fenrid
          path: dist

      - name: Bundle the mod
        run: |
          mkdir -p android/app/src/main/assets
          cp dist/betterfenrid.js android/app/src/main/assets/betterfenrid.js

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Load the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "BF_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE secret. This APK is signed with a throwaway key and can't update an earlier install"
          fi

      - name: Build the APK
        working-directory: android
        env:
          BF_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - run: cp android/app/build/outputs/apk/release/app-release.apk Better-Fenrid.apk

      - uses: actions/upload-artifact@v4
        with:
          name: better-fenrid-android
          path: Better-Fenrid.apk

      - name: Attach to this build's release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BF_VERSION }}
          files: Better-Fenrid.apk

      - name: Update the Android release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: Better Fenrid for Android
          target_commitish: ${{ github.sha }}
          make_latest: 'false'
          body: |
            The newest Better Fenrid app for Android, built from ${{ github.sha }} with mod v${{ env.BF_VERSION }} inside.
            The mod updates itself, so this only needs downloading again when the app itself changes.
          files: Better-Fenrid.apk