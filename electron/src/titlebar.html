<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Better Fenrid</title>
  <style>
    :root {
      --bg: #141418;
      --fg: #b5b6bd;
      color-scheme: dark;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      transition: background-color 0.25s ease;
    }

    .bar {
      position: fixed;
      top: env(titlebar-area-y, 0);
      left: env(titlebar-area-x, 0);
      width: env(titlebar-area-width, calc(100% - 138px));
      height: env(titlebar-area-height, 32px);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 12px;
      box-sizing: border-box;
      color: var(--fg);
      font: 600 12px/1 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
      letter-spacing: 0.01em;
      user-select: none;
      -webkit-app-region: drag;
      transition: color 0.25s ease, opacity 0.2s ease;
    }

    body.blurred .bar {
      opacity: 0.6;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .brand img {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }

    .brand span {
      white-space: nowrap;
    }

    .title {
      max-width: 50vw;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-weight: 500;
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <div class="bar">
    <div class="brand">
      <img src="../assets/tray.png" alt="">
      <span>Better Fenrid</span>
    </div>
    <div class="title" id="title"></div>
    <div></div>
  </div>
  <script>
    const title = document.getElementById('title')

    window.titleBar.onState((state) => {

      document.documentElement.style.setProperty('--bg', state.background)
      document.documentElement.style.setProperty('--fg', state.foreground)

      const text = /^Fenrid\s*\|/.test(state.title) ? '' : state.title.replace(/\s*[|·–-]\s*Fenrid$/, '')

      title.textContent = text
      title.title = text
    })

    window.titleBar.onFocus((focused) => document.body.classList.toggle('blurred', !focused))
    window.titleBar.ready()
  </script>
</body>

</html>
