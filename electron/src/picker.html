<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>Share your screen</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1b1b20;
      --card: #24242b;
      --border: #34343d;
      --text: #f0f1f4;
      --muted: #a2a3ad;
      --accent: #8b5cf6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 system-ui, 'Segoe UI', sans-serif;
      user-select: none;
    }

    header {
      padding: 16px 20px 0;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 600;
    }

    .tabs {
      display: flex;
      gap: 6px;
    }

    .tabs button {
      padding: 6px 14px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      cursor: pointer;
      transition: background .15s, color .15s;
    }

    .tabs button:hover {
      background: var(--card);
      color: var(--text);
    }

    .tabs button[aria-selected="true"] {
      background: var(--card);
      color: var(--text);
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px;
      align-content: start;
    }

    .source {
      padding: 8px;
      border: 2px solid transparent;
      border-radius: 8px;
      background: var(--card);
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: border-color .15s, transform .15s;
    }

    .source:hover {
      transform: translateY(-1px);
      border-color: var(--border);
    }

    .source[aria-pressed="true"] {
      border-color: var(--accent);
    }

    .source img.thumb {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      border-radius: 4px;
      background: #000;
    }

    .name {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }

    .name img {
      width: 16px;
      height: 16px;
      flex: none;
    }

    .name span {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    footer {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      border-top: 1px solid var(--border);
    }

    label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      cursor: pointer;
    }

    .spacer {
      flex: 1;
    }

    footer button {
      padding: 8px 18px;
      border: 0;
      border-radius: 6px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    #cancel {
      background: transparent;
      color: var(--text);
    }

    #cancel:hover {
      text-decoration: underline;
    }

    #share {
      background: var(--accent);
      color: #fff;
    }

    #share:disabled {
      opacity: .5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <header>
    <h1>Share your screen</h1>
    <div class="tabs" role="tablist">
      <button role="tab" data-kind="screen" aria-selected="true">Screens</button>
      <button role="tab" data-kind="window" aria-selected="false">Windows</button>
    </div>
  </header>
  <main id="list"></main>
  <footer>
    <label><input type="checkbox" id="audio" checked> Share audio</label>
    <span class="spacer"></span>
    <button id="cancel" type="button">Cancel</button>
    <button id="share" type="button" disabled>Share</button>
  </footer>
  <script>
    const list = document.getElementById('list')
    const share = document.getElementById('share')
    let sources = []
    let kind = 'screen'
    let selected = null

    function render() {

      list.replaceChildren()

      for (const source of sources.filter((s) => s.kind === kind)) {

        const button = document.createElement('button')
        button.className = 'source'
        button.type = 'button'
        button.setAttribute('aria-pressed', String(source.id === selected))

        const thumb = document.createElement('img')
        thumb.className = 'thumb'
        thumb.src = source.thumbnail
        thumb.alt = ''

        const name = document.createElement('div')
        name.className = 'name'

        if (source.icon) {

          const icon = document.createElement('img')
          icon.src = source.icon
          icon.alt = ''
          name.append(icon)

        }

        const label = document.createElement('span')
        label.textContent = source.name
        label.title = source.name
        name.append(label)

        button.append(thumb, name)
        button.addEventListener('click', () => { selected = source.id; share.disabled = false; render() })
        button.addEventListener('dblclick', () => window.picker.choose(source.id, document.getElementById('audio').checked))

        list.append(button)
      }
    }

    for (const tab of document.querySelectorAll('[role="tab"]')) {

      tab.addEventListener('click', () => {

        kind = tab.dataset.kind

        for (const other of document.querySelectorAll('[role="tab"]')) other.setAttribute('aria-selected', String(other === tab))

        render()
      })
    }

    share.addEventListener('click', () => selected && window.picker.choose(selected, document.getElementById('audio').checked))
    document.getElementById('cancel').addEventListener('click', () => window.picker.cancel())
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape') window.picker.cancel() })

    window.picker.sources().then((result) => {

      sources = result
      selected = sources.find((s) => s.kind === 'screen')?.id ?? null
      share.disabled = !selected
      render()
    })
  </script>
</body>

</html>
